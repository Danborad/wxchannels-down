<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Channels — 微信视频号纯净提取</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%23000%22/><polygon points=%2240,32 70,50 40,68%22 fill=%22%23fff%22/></svg>">
  <style>
    :root {
      --bg: #fafafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-solid: #ffffff;
      --border: rgba(0, 0, 0, 0.07);
      --border-hover: rgba(0, 0, 0, 0.16);
      --text: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --accent: #111827;
      --accent-hover: #000000;
      --accent-text: #ffffff;
      --pill-bg: #f3f4f6;
      --shadow-ambient: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
      --shadow-float: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090a0f;
        --card-bg: rgba(18, 20, 29, 0.82);
        --card-solid: #12141d;
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.18);
        --text: #f9fafb;
        --text-secondary: #9ca3af;
        --text-muted: #6b7280;
        --accent: #ffffff;
        --accent-hover: #f3f4f6;
        --accent-text: #090a0f;
        --pill-bg: rgba(255, 255, 255, 0.06);
        --shadow-ambient: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
        --shadow-float: 0 12px 30px -8px rgba(0, 0, 0, 0.6);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(16px, 3vh, 32px) clamp(14px, 3vw, 24px);
    }

    /* 极简居中主舞台 */
    .stage {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 艺术感顶标 */
    .brand {
      text-align: center;
      padding: 6px 0 2px;
      user-select: none;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .brand-mark svg {
      width: 18px;
      height: 18px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-top: 3px;
      font-weight: 400;
    }

    /* 输入栏：悬浮交互胶囊 */
    .capsule-form {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-float);
      transition: all 0.25s var(--ease);
    }

    .capsule-form:focus-within {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-ambient), 0 0 0 1px var(--border-hover);
    }

    .capsule-icon {
      padding-left: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .capsule-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      letter-spacing: -0.01em;
      padding: 8px 4px;
      min-width: 0;
    }

    .capsule-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .capsule-btn-paste {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .capsule-btn-paste:hover {
      background: var(--pill-bg);
      color: var(--text);
    }

    .capsule-btn-submit {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 10px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .capsule-btn-submit:hover {
      background: var(--accent-hover);
      transform: scale(0.98);
    }

    .capsule-btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 错误提示框 */
    .notice {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.4;
      display: none;
      animation: fadeIn 0.3s var(--ease);
    }

    .notice.error {
      display: block;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    /* 结果展台：精致画廊卡片 (单屏展示) */
    .bento-card {
      display: none;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-ambient);
      animation: slideUp 0.35s var(--ease);
    }

    .bento-layout {
      display: flex;
      gap: 18px;
      align-items: stretch;
    }

    /* 左侧：画廊视口 */
    .gallery-pane {
      flex: 0 0 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    .gallery-video {
      width: 100%;
      height: 100%;
      max-height: 340px;
      aspect-ratio: 9/16;
      object-fit: contain;
      display: block;
      outline: none;
    }

    .album-flow {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 6px;
    }

    .album-slot {
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background: var(--pill-bg);
    }

    .album-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 右侧：排版与指令 */
    .story-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .creator-line {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .creator-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--pill-bg);
      border: 1px solid var(--border);
    }

    .creator-meta {
      flex: 1;
      min-width: 0;
    }

    .creator-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text);
    }

    .creator-badge {
      width: 12px;
      height: 12px;
    }

    .creator-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .caption-scroll {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
      background: var(--pill-bg);
      border-radius: 10px;
      padding: 10px 12px;
      max-height: 78px;
      overflow-y: auto;
      word-break: break-all;
    }

    .metrics-ribbon {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    .metric-chip {
      background: var(--pill-bg);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* 动作按钮网格 */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 2px;
    }

    .cmd-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s var(--ease);
      border: 1px solid var(--border);
      background: var(--card-solid);
      color: var(--text);
      white-space: nowrap;
    }

    .cmd-btn:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .cmd-btn.prime {
      grid-column: span 2;
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      padding: 9px 14px;
    }

    .cmd-btn.prime:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* 历史归档区 (简洁质感) */
    .archive-card {
      display: none;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-float);
    }

    .archive-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .archive-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .archive-count {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .archive-clear {
      background: none;
      border: none;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s;
    }

    .archive-clear:hover {
      color: #ef4444;
    }

    .archive-stream {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 230px;
      overflow-y: auto;
    }

    .archive-entry {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 9px;
      background: var(--pill-bg);
      border: 1px solid transparent;
      transition: all 0.15s var(--ease);
    }

    .archive-entry:hover {
      border-color: var(--border-hover);
      background: var(--card-solid);
    }

    .archive-poster {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
      cursor: pointer;
    }

    .archive-detail {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .archive-caption {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .archive-subtext {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .archive-actions {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }

    .archive-action-btn {
      background: var(--card-solid);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }

    .archive-action-btn:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    /* 移动端排版优化 */
    @media (max-width: 680px) {
      body {
        padding: 10px 8px;
      }
      .bento-layout {
        flex-direction: column;
        gap: 12px;
      }
      .gallery-pane {
        flex: 1;
        width: 100%;
      }
      .gallery-video {
        max-height: 280px;
      }
      .caption-scroll {
        max-height: 60px;
      }
      .controls-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* Toast 通知 */
    .toast-bubble {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s var(--ease);
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .toast-bubble.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<main class="stage">
  <!-- 极简 Logo 与标题 -->
  <header class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <span>Channels</span>
    </div>
    <div class="brand-sub">原画无水印直链提取</div>
  </header>

  <!-- 搜索胶囊 -->
  <div class="capsule-form">
    <div class="capsule-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <input type="text" id="urlInput" class="capsule-input" placeholder="粘贴视频号分享链接..." autocomplete="off">
    <button class="capsule-btn-paste" id="btnPaste">粘贴</button>
    <button class="capsule-btn-submit" id="btnParse">提取</button>
  </div>

  <div id="noticeBox" class="notice"></div>

  <!-- 结果画廊卡片 (单屏紧凑) -->
  <section id="resultCard" class="bento-card">
    <div class="bento-layout">
      <!-- 媒体画廊视口 -->
      <div class="gallery-pane">
        <video id="videoView" class="gallery-video" controls playsinline preload="metadata"></video>
        <div id="albumView" class="album-flow" style="display: none;"></div>
      </div>

      <!-- 内容排版与操作 -->
      <div class="story-pane">
        <div class="creator-line">
          <img id="creatorAvatar" class="creator-avatar" src="" alt="" onerror="this.style.display='none'">
          <div class="creator-meta">
            <div class="creator-name">
              <span id="creatorName">作者</span>
              <img id="creatorBadge" class="creator-badge" src="" style="display: none;">
            </div>
            <div id="postTime" class="creator-time">-</div>
          </div>
        </div>

        <div id="postDesc" class="caption-scroll"></div>

        <div class="metrics-ribbon">
          <span class="metric-chip">赞 <b id="statLike">0</b></span>
          <span class="metric-chip">藏 <b id="statFav">0</b></span>
          <span class="metric-chip">转 <b id="statForward">0</b></span>
          <span class="metric-chip">评 <b id="statComment">0</b></span>
        </div>

        <div class="controls-grid">
          <a id="btnDownload" class="cmd-btn prime" href="#" target="_blank">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>下载原画 MP4</span>
          </a>
          <button id="btnCopyLink" class="cmd-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>复制直链</span>
          </button>
          <button id="btnCopyText" class="cmd-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>复制文案</span>
          </button>
          <a id="btnCover" class="cmd-btn" href="#" target="_blank">封面图片</a>
          <a id="btnBgm" class="cmd-btn" style="display: none;" href="#" target="_blank">背景音乐</a>
        </div>
      </div>
    </div>
  </section>

  <!-- 归档卡片 (LocalStorage 历史记录) -->
  <section class="archive-card" id="archiveCard">
    <div class="archive-header">
      <span class="archive-title">
        <span>历史记录</span>
        <span id="archiveCount" class="archive-count"></span>
      </span>
      <button class="archive-clear" id="btnClearArchive">清空</button>
    </div>
    <div class="archive-stream" id="archiveStream"></div>
  </section>
</main>

<div id="toastBubble" class="toast-bubble"></div>

<script>
  const urlInput = document.getElementById("urlInput");
  const btnPaste = document.getElementById("btnPaste");
  const btnParse = document.getElementById("btnParse");
  const noticeBox = document.getElementById("noticeBox");
  const resultCard = document.getElementById("resultCard");
  const toastBubble = document.getElementById("toastBubble");

  const videoView = document.getElementById("videoView");
  const albumView = document.getElementById("albumView");
  const creatorAvatar = document.getElementById("creatorAvatar");
  const creatorName = document.getElementById("creatorName");
  const creatorBadge = document.getElementById("creatorBadge");
  const postTime = document.getElementById("postTime");
  const postDesc = document.getElementById("postDesc");
  const btnDownload = document.getElementById("btnDownload");
  const btnCopyLink = document.getElementById("btnCopyLink");
  const btnCopyText = document.getElementById("btnCopyText");
  const btnCover = document.getElementById("btnCover");
  const btnBgm = document.getElementById("btnBgm");

  const archiveCard = document.getElementById("archiveCard");
  const archiveStream = document.getElementById("archiveStream");
  const archiveCount = document.getElementById("archiveCount");
  const btnClearArchive = document.getElementById("btnClearArchive");

  let activeData = null;
  const ARCHIVE_KEY = "wxchannels_archive_v2";

  function toast(msg) {
    toastBubble.textContent = msg;
    toastBubble.classList.add("show");
    setTimeout(() => { toastBubble.classList.remove("show"); }, 2200);
  }

  function showNotice(msg) {
    noticeBox.textContent = msg;
    noticeBox.className = "notice error";
  }

  function hideNotice() {
    noticeBox.className = "notice";
    noticeBox.textContent = "";
  }

  // 剪贴板快速粘贴
  btnPaste.addEventListener("click", async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        urlInput.value = text;
        toast("已粘贴内容");
      }
    } catch (_) {
      urlInput.focus();
    }
  });

  // 解析指令
  btnParse.addEventListener("click", handleExtract);
  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleExtract();
  });

  async function handleExtract() {
    const raw = urlInput.value.trim();
    if (!raw) {
      showNotice("请粘贴有效的微信视频号分享链接");
      return;
    }
    const match = raw.match(/https:\/\/weixin\.qq\.com\/sph\/[a-zA-Z0-9_-]+/);
    const targetUrl = match ? match[0] : raw;

    hideNotice();
    btnParse.disabled = true;
    btnParse.textContent = "解析中";

    try {
      const resp = await fetch("/api/parse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: targetUrl }),
      });
      const res = await resp.json();
      if (!res.success) throw new Error(res.error || "提取失败");

      activeData = res.data;
      renderGallery(res.data);
      recordArchive(targetUrl, res.data);
      toast("解析完成");
    } catch (err) {
      showNotice(err.message);
    } finally {
      btnParse.disabled = false;
      btnParse.textContent = "提取";
    }
  }

  function renderGallery(data) {
    const { author, feed } = data;

    creatorName.textContent = author.nickname || "视频作者";
    if (author.headImgUrl) {
      creatorAvatar.src = author.headImgUrl;
      creatorAvatar.style.display = "block";
    } else {
      creatorAvatar.style.display = "none";
    }

    if (author.authInfo) {
      creatorBadge.src = author.authInfo;
      creatorBadge.style.display = "inline-block";
    } else {
      creatorBadge.style.display = "none";
    }

    postTime.textContent = feed.createTime ? new Date(feed.createTime * 1000).toLocaleString("zh-CN") : "";
    postDesc.textContent = feed.description || "（无文案标题）";

    document.getElementById("statLike").textContent = feed.stats.likeCount || "0";
    document.getElementById("statFav").textContent = feed.stats.favCount || "0";
    document.getElementById("statForward").textContent = feed.stats.forwardCount || "0";
    document.getElementById("statComment").textContent = feed.stats.commentCount || "0";

    if (feed.videoUrl) {
      videoView.style.display = "block";
      albumView.style.display = "none";
      videoView.src = feed.videoUrl;
      if (feed.coverUrl) videoView.poster = feed.coverUrl;

      const fn = (author.nickname + "_" + (feed.description ? feed.description.slice(0, 25) : "video")).replace(/[\\/:*?"<>|]/g, "_") + ".mp4";
      btnDownload.href = `/api/download?url=${encodeURIComponent(feed.videoUrl)}&filename=${encodeURIComponent(fn)}`;
      btnDownload.style.display = "inline-flex";
    } else {
      videoView.style.display = "none";
      btnDownload.style.display = "none";
      if (feed.picList && feed.picList.length > 0) {
        albumView.style.display = "grid";
        albumView.innerHTML = feed.picList.map((p) => `
          <div class="album-slot">
            <a href="${p}" target="_blank"><img src="${p}" loading="lazy"></a>
          </div>
        `).join("");
      }
    }

    if (feed.coverUrl) {
      btnCover.href = feed.coverUrl;
      btnCover.style.display = "inline-flex";
    } else {
      btnCover.style.display = "none";
    }

    if (feed.bgm && feed.bgm.url) {
      btnBgm.href = `/api/download?url=${encodeURIComponent(feed.bgm.url)}&filename=${encodeURIComponent(feed.bgm.name || "bgm")}.mp3`;
      btnBgm.style.display = "inline-flex";
    } else {
      btnBgm.style.display = "none";
    }

    resultCard.style.display = "block";
  }

  btnCopyLink.addEventListener("click", () => {
    if (!activeData?.feed?.videoUrl) return;
    navigator.clipboard.writeText(activeData.feed.videoUrl).then(() => toast("直链已复制"));
  });

  btnCopyText.addEventListener("click", () => {
    if (!activeData?.feed?.description) return;
    navigator.clipboard.writeText(activeData.feed.description).then(() => toast("文案已复制"));
  });

  // ---------------- 本地档案 (LocalStorage) ----------------
  function readArchive() {
    try {
      return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || "[]");
    } catch (_) {
      return [];
    }
  }

  function recordArchive(shareUrl, data) {
    const list = readArchive();
    const id = data.exportId || shareUrl;
    const cleanList = list.filter((item) => item.id !== id);
    cleanList.unshift({
      id,
      shareUrl,
      title: data.feed.description || "无标题视频",
      author: data.author.nickname || "未知作者",
      cover: data.feed.coverUrl || (data.feed.picList && data.feed.picList[0]) || "",
      videoUrl: data.feed.videoUrl || "",
      time: Date.now(),
      payload: data,
    });
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(cleanList.slice(0, 30)));
    renderArchive();
  }

  function renderArchive() {
    const list = readArchive();
    if (list.length === 0) {
      archiveCard.style.display = "none";
      return;
    }
    archiveCard.style.display = "flex";
    archiveCount.textContent = `· ${list.length}`;
    archiveStream.innerHTML = list.map((item, idx) => `
      <div class="archive-entry">
        <img class="archive-poster" src="${item.cover}" alt="" onclick="loadArchived(${idx})" onerror="this.style.display='none'">
        <div class="archive-detail" onclick="loadArchived(${idx})">
          <div class="archive-caption">${item.title}</div>
          <div class="archive-subtext">${item.author} · ${new Date(item.time).toLocaleDateString()}</div>
        </div>
        <div class="archive-actions">
          ${item.videoUrl ? `<a class="archive-action-btn" href="/api/download?url=${encodeURIComponent(item.videoUrl)}&filename=${encodeURIComponent((item.title || 'video').slice(0, 20) + '.mp4')}" target="_blank">下载</a>` : ''}
          <button class="archive-action-btn" onclick="copyArchived(${idx})">复制</button>
          <button class="archive-action-btn" style="color:#ef4444" onclick="removeArchived(${idx})">×</button>
        </div>
      </div>
    `).join("");
  }

  window.loadArchived = function(idx) {
    const list = readArchive();
    if (list[idx]) {
      activeData = list[idx].payload;
      renderGallery(list[idx].payload);
      toast("已调取历史记录");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  };

  window.copyArchived = function(idx) {
    const list = readArchive();
    if (list[idx] && list[idx].videoUrl) {
      navigator.clipboard.writeText(list[idx].videoUrl).then(() => toast("直链已复制"));
    }
  };

  window.removeArchived = function(idx) {
    const list = readArchive();
    list.splice(idx, 1);
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(list));
    renderArchive();
  };

  btnClearArchive.addEventListener("click", () => {
    if (!confirm("确定清空全部历史记录吗？")) return;
    localStorage.removeItem(ARCHIVE_KEY);
    renderArchive();
    toast("已清空");
  });

  renderArchive();
</script>
</body>
</html>
